name: Build (Manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform(s) to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - web
      # NOT a Gradle product flavor. This project configures itself through
      # `.env` layering and --dart-define (see docs/guides/configuration.md and
      # lib/core/config/app_config.dart, which reads ENVIRONMENT). No
      # productFlavors are declared in android/app/build.gradle.kts, so passing
      # --flavor made `flutter build apk` fail with
      # "Task 'assembleDevelopmentRelease' not found".
      environment:
        description: 'Value passed as --dart-define=ENVIRONMENT'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      base_url:
        description: 'Override BASE_URL (optional)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://localhost:3000"
          fi

          flutter build apk \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=BASE_URL="$BASE_URL"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ inputs.environment }}
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    name: Build iOS (no codesign)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS
        shell: bash
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://localhost:3000"
          fi

          flutter build ios \
            --no-codesign \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=BASE_URL="$BASE_URL"

  build-web:
    if: inputs.platform == 'all' || inputs.platform == 'web'
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        shell: bash
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://localhost:3000"
          fi

          flutter build web \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=BASE_URL="$BASE_URL"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ inputs.environment }}
          path: build/web

