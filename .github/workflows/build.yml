name: Build (Manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform(s) to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - web
      # NOT a Gradle product flavor. This project configures itself through
      # `.env` layering and --dart-define (see docs/guides/configuration.md and
      # lib/core/config/app_config.dart, which reads ENVIRONMENT). No
      # productFlavors are declared in android/app/build.gradle.kts, so passing
      # --flavor made `flutter build apk` fail with
      # "Task 'assembleDevelopmentRelease' not found".
      environment:
        description: 'Value passed as --dart-define=ENVIRONMENT'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      base_url:
        description: 'Override BASE_URL (optional)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # `flutter build apk` defaults to --release, and android/app/build.gradle.kts
      # now refuses to sign a release with the debug keystore. This job is a
      # throwaway smoke build, so it mints a throwaway key and follows exactly the
      # key.properties recipe documented in deploy-android.yml. The resulting APK
      # is NOT distributable - it is signed by a key that exists only for the
      # lifetime of this runner.
      - name: Generate throwaway release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore android/ci-throwaway-keystore.jks \
            -storetype JKS \
            -storepass ci-throwaway -keypass ci-throwaway \
            -alias ci-throwaway \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=CI Throwaway, OU=flutter-starter, O=flutter-starter, C=US"
          {
            echo "storeFile=ci-throwaway-keystore.jks"
            echo "storePassword=ci-throwaway"
            echo "keyAlias=ci-throwaway"
            echo "keyPassword=ci-throwaway"
          } > android/key.properties

      - name: Build APK
        shell: bash
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://localhost:3000"
          fi

          flutter build apk \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=BASE_URL="$BASE_URL"

      # Proves the APK is not debug-signed. A debug-signed artifact reports
      # "CN=Android Debug, O=Android, C=US"; this must report the throwaway CI
      # identity minted above. The step FAILS if it cannot read a certificate at
      # all, so it can never silently pass having verified nothing.
      #
      # apksigner, not `unzip META-INF/*.RSA`: this APK carries only v2/v3
      # signatures, which live in the APK Signing Block before the central
      # directory, not in META-INF. The v1-only reading printed nothing.
      - name: Print APK signer certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "APK: $APK"

          APKSIGNER=$(ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ANDROID_HOME; cannot verify the signer."
            exit 1
          fi
          echo "Using: $APKSIGNER"

          "$APKSIGNER" verify --print-certs --verbose "$APK" | tee /tmp/apk-certs.txt

          if ! grep -q 'Signer #1 certificate DN:' /tmp/apk-certs.txt; then
            echo "::error::apksigner printed no certificate DN."
            exit 1
          fi
          if grep -q 'CN=Android Debug' /tmp/apk-certs.txt; then
            echo "::error::APK is DEBUG-signed. android/app/build.gradle.kts is supposed to make this impossible."
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ inputs.environment }}
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    name: Build iOS (no codesign)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS
        shell: bash
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://localhost:3000"
          fi

          flutter build ios \
            --no-codesign \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=BASE_URL="$BASE_URL"

  build-web:
    if: inputs.platform == 'all' || inputs.platform == 'web'
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        shell: bash
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://localhost:3000"
          fi

          flutter build web \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=BASE_URL="$BASE_URL"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ inputs.environment }}
          path: build/web

