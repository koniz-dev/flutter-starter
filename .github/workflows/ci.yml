name: CI

# ========================================================================
# Workflow Triggers Configuration
# ========================================================================
# Single Ubuntu job (one checkout + one Flutter setup + one pub get) to keep
# GitHub Actions minutes low for forks and small teams. For faster feedback at
# higher cost, split format/analyze/test into parallel jobs again.
# ========================================================================
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `channel: stable` is intentionally left floating - no `flutter-version`
      # pin (removed deliberately in a4bc68a) - so this gate also acts as an
      # early warning that a new stable SDK has landed.
      #
      # Consequence to know about: `flutter analyze` exits non-zero on ANY
      # diagnostic, including `info`. A new stable can therefore turn `main` red
      # without a single line of app code changing, and the failure will surface
      # on whatever PR happens to be open next. When that happens the fix is to
      # clear the new lints on `main` first (do not chase it inside an unrelated
      # PR). This is what happened in run 32638785145 under stable-3.47.1.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test integration_test tool examples

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        timeout-minutes: 15
        run: flutter test --timeout=5m
