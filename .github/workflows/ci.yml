name: CI

# ========================================================================
# Workflow Triggers Configuration
# ========================================================================
# Single Ubuntu job (one checkout + one Flutter setup + one pub get) to keep
# GitHub Actions minutes low for forks and small teams. For faster feedback at
# higher cost, split format/analyze/test into parallel jobs again.
#
# NO `paths-ignore`, deliberately. This job has
# to post a conclusion on EVERY pull request, because a required status check
# that never reports leaves the pull request stuck on "Expected - waiting for
# status to be reported" forever. `paths-ignore` suppresses the whole workflow
# run, so the check never appears at all on a docs-only pull request. The path
# filtering therefore
# moved INSIDE the job, to the "Decide the gate scope" step below: the job
# always runs and always reports, and skips the expensive steps when nothing it
# checks could have changed.
# ========================================================================
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the scope step diffs base..head. A shallow clone
      # has neither end of that range. Costs a second or two on this repository
      # and is what keeps the skip decision honest.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Replaces the old workflow-level `paths-ignore: ['**/*.md', 'docs/**']`.
      #
      # A path is inert for this gate only if it can change none of the three
      # things the gate actually runs:
      #   * `dart format` over lib test integration_test tool examples
      #   * `flutter analyze` over the package (minus analysis_options excludes)
      #   * `flutter test` over test/
      #
      # `**/*.md` qualifies: no step reads markdown. `docs/**` mostly qualifies
      # - EXCEPT `docs/**/*.dart`. `analysis_options.yaml` does not exclude
      # `docs/`, so a Dart file committed under it is analyzed like any other.
      # Treating it as inert would let a broken one through the gate and turn
      # `main` red on somebody else's unrelated pull request. So `.dart` is
      # never inert, wherever it lives.
      #
      # Anything the step cannot resolve a diff for - workflow_dispatch, a brand
      # new branch, a force push that dropped `before` - fails SAFE and runs the
      # full gate.
      - name: Decide the gate scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          have() { git rev-parse -q --verify "$1^{commit}" >/dev/null 2>&1; }

          range=''
          case "$EVENT_NAME" in
            pull_request)
              # Three dots: compare head against the merge base, so commits
              # that landed on main after this branch started are not counted
              # as this pull request's changes.
              if have "$PR_BASE_SHA" && have "$PR_HEAD_SHA"; then
                range="$PR_BASE_SHA...$PR_HEAD_SHA"
              fi
              ;;
            push)
              if have "$PUSH_BEFORE" && have "$PUSH_AFTER"; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
          esac

          if [ -z "$range" ]; then
            run=true
            verdict="Could not resolve a diff range for a '$EVENT_NAME' event. Running the full gate."
            changed=''
          else
            changed="$(git diff --name-only "$range")"
            # Everything outside the inert set, plus every .dart file wherever
            # it lives.
            relevant="$(
              {
                printf '%s\n' "$changed" | grep -Ev '^(docs/.*|.*\.md)$' || true
                printf '%s\n' "$changed" | grep -E '^docs/.*\.dart$' || true
              } | grep -v '^$' | sort -u || true
            )"
            if [ -n "$relevant" ]; then
              run=true
              verdict="$(printf '%s\n' "$relevant" | wc -l | tr -d ' ') changed path(s) can affect this gate. Running format, analyze and test."
            else
              run=false
              verdict="Every changed path matches \`**/*.md\` or \`docs/**\` (and none is a \`.dart\` file), so nothing this gate checks could have changed. format, analyze and test were NOT run."
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"

          {
            echo "### Quality gate scope"
            echo
            echo "- event: \`$EVENT_NAME\`"
            echo "- range: \`${range:-unresolved}\`"
            echo "- expensive steps run: \`$run\`"
            echo
            echo "$verdict"
            echo
            echo "<details><summary>Changed paths</summary>"
            echo
            echo '```'
            if [ -n "$changed" ]; then printf '%s\n' "$changed"; else echo "(none)"; fi
            echo '```'
            echo
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # `channel: stable` is intentionally left floating - no `flutter-version`
      # pin (removed deliberately in a4bc68a) - so this gate also acts as an
      # early warning that a new stable SDK has landed.
      #
      # Consequence to know about: `flutter analyze` exits non-zero on ANY
      # diagnostic, including `info`. A new stable can therefore turn `main` red
      # without a single line of app code changing, and the failure will surface
      # on whatever PR happens to be open next. When that happens the fix is to
      # clear the new lints on `main` first (do not chase it inside an unrelated
      # PR). This is what happened in run 32638785145 under stable-3.47.1.
      - name: Setup Flutter
        if: steps.scope.outputs.run == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: flutter pub get

      # Generated code is committed, so it must match its sources: a provider
      # edited without re-running build_runner left stale hashes that the
      # next adopter to regenerate got as an unrelated diff.
      # `git status --porcelain` rather than
      # `git diff` so a new, untracked output fails too.
      - name: Check generated code is up to date
        if: steps.scope.outputs.run == 'true'
        run: |
          dart run build_runner build -d
          drift="$(git status --porcelain -- '*.g.dart' '*.freezed.dart')"
          if [ -n "$drift" ]; then
            echo "::error::build_runner rewrote committed generated files. Run 'dart run build_runner build -d' and commit the result:"
            echo "$drift"
            git diff -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi
          echo "Generated code matches its sources."

      - name: Verify formatting
        if: steps.scope.outputs.run == 'true'
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool examples

      - name: Analyze code
        if: steps.scope.outputs.run == 'true'
        run: flutter analyze

      # The suite runs in a fresh random order on every PR, so a test that
      # only passes because of the tests before it fails here, not in a fork
      # months later. flutter
      # prints the seed it picked; a failure repeats it with the exact command
      # that reproduces the order.
      - name: Run tests (random order)
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          flutter test --coverage --timeout=5m --test-randomize-ordering-seed random \
            2>&1 | tee "$RUNNER_TEMP/flutter-test.log"
          status=${PIPESTATUS[0]}
          set -e
          seed=$(grep -o -m1 'test-randomize-ordering-seed=[0-9]*' \
            "$RUNNER_TEMP/flutter-test.log" | cut -d= -f2 || true)
          echo "Test order seed: ${seed:-unknown}"
          echo "- Test order seed: \`${seed:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=flutter test failed (random order seed ${seed:-unknown})::Reproduce with: flutter test --test-randomize-ordering-seed ${seed:-unknown}"
            echo "- **Failed.** Reproduce with \`flutter test --test-randomize-ordering-seed ${seed:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # Total line coverage is a per-PR floor, so a pull request that deletes
      # tests fails here instead of weeks later in coverage.yml's weekly
      # report. test_coverage.sh removes the same files coverage.yml removes
      # (generated code, l10n, main.dart, test helpers) using only awk, so this
      # step installs nothing.
      #
      # The floor sits a little below what the starter measures today, with
      # and without its sample features stripped, so a fresh project starts
      # green. Raise it as your suite grows; coverage.yml keeps the per-layer
      # targets.
      - name: Enforce minimum coverage
        if: steps.scope.outputs.run == 'true'
        env:
          COVERAGE_MIN_TOTAL: 94
        shell: bash
        run: |
          # Actions runs bash with -e: without set +e a failing check exits
          # here, before the summary line and the annotation below.
          set +e
          ./scripts/test/test_coverage.sh --no-test --min="$COVERAGE_MIN_TOTAL" \
            | tee "$RUNNER_TEMP/coverage.log"
          status=${PIPESTATUS[0]}
          set -e
          total=$(grep -oE 'Coverage: [0-9.]+%' "$RUNNER_TEMP/coverage.log" | grep -oE '[0-9.]+%' || true)
          echo "- Line coverage: \`${total:-unknown}\` (minimum \`${COVERAGE_MIN_TOTAL}%\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Coverage below minimum::Line coverage ${total:-unknown} is below ${COVERAGE_MIN_TOTAL}%. Add tests, or lower COVERAGE_MIN_TOTAL in ci.yml with a reason."
          fi
          exit "$status"

      # pub get, analyze and test must leave every tracked file as committed.
      # Flutter's own migrations (analyzer excludes, the Pods includes in the
      # xcconfigs) and the lock as this stable resolves it are committed, so a
      # diff here means a new stable re-pinned or re-migrated something - the
      # same event as a new stable's lints, handled the same way: fix it on
      # main first.
      - name: Tracked files are unchanged
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          dirty=$(git status --porcelain --untracked-files=no)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            git diff --stat
            echo "::error title=pub get / analyze / test changed tracked files::Run flutter pub get on main with this stable and commit the result (usually pubspec.lock or analysis_options.yaml)."
            echo "- **Tracked files changed by pub get / analyze / test:**" >> "$GITHUB_STEP_SUMMARY"
            echo "$dirty" | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No tracked file changed."
