# Patrol E2E on Android. Never runs on a pull request, so it never blocks one.
#
# Needs no backend: built without `BASE_URL`, the auth -> home test signs in
# through the offline demo account (see integration_test/app_e2e_test.dart).
# Built with `--dart-define=BASE_URL=<url>`, it signs in against that API
# instead, which must then be reachable from the emulator.
#
# Triggers:
#   * workflow_dispatch - any repository, any time.
#   * schedule (weekly) - template repository only, so a Patrol, AGP or
#     emulator change that breaks the harness surfaces within a week rather
#     than whenever someone next dispatches it. A repository created from the
#     template ("Use this template") skips the scheduled run:
#     `github.event.repository.is_template` is true only in the template
#     itself. To run it weekly in your project, drop that condition from the
#     job's `if:` below; it costs roughly 40 runner minutes a week.
name: E2E Android (Patrol)

on:
  schedule:
    - cron: '0 4 * * 1' # weekly (Mon 04:00 UTC), after coverage.yml's slot
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level'
        required: true
        default: '34'
      emulator_profile:
        description: 'AVD profile name'
        required: true
        default: 'pixel_6'

concurrency:
  group: e2e-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patrol:
    name: Patrol on Android emulator
    if: github.event_name == 'workflow_dispatch' || github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      - name: Add Pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # Keep the CLI compatible with patrol (^4.11.0) in pubspec.yaml.
      # Patrol 4.9.0+ requires patrol_cli 4.7.0+; use the 4.9.0 CLI
      # released alongside Patrol 4.11.0. Update the local setup docs too.
      # https://patrol.leancode.co/documentation/compatibility-table
      # Dependabot is told to ignore patrol because these versions must move
      # together, but it still moves patrol when another package's update
      # requires it; test/tooling/dependabot_config_test.dart fails that PR
      # until this pin moves too.
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli 4.9.0

      - name: Run Patrol tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # A scheduled run has no `inputs`, so these fall back to the
          # dispatch form's defaults above. Keep the two in step.
          api-level: ${{ inputs.api_level || '34' }}
          arch: x86_64
          profile: ${{ inputs.emulator_profile || 'pixel_6' }}
          # `bash -o pipefail` is load-bearing. The emulator-runner executes this
          # via /usr/bin/sh, so a bare `patrol test ... | tee` returns tee's exit
          # status and a FAILING test set reports as a green job. Verified: a run
          # with "Failed: 1" concluded success until this was added.
          script: bash -o pipefail -c 'patrol test --target integration_test/app_e2e_test.dart 2>&1 | tee patrol-output.log'

      # `patrol test` exits 0 on an EMPTY test set, and on one whose tests were
      # all skipped. Before the native androidTest source set existed, this job
      # went green reporting "Total: 0" - a tick that verified nothing, which is
      # worse than a red. The script fails unless every collected test ran and
      # passed; scripts/test/run_e2e_tests.sh applies the same rule locally.
      - name: Reject an empty, failed or skipped test run
        if: always()
        run: ./scripts/test/check_patrol_summary.sh patrol-output.log

      - name: Upload Patrol output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patrol-output
          path: patrol-output.log
          if-no-files-found: warn
