# Verifies every `tool/strip_sample_features.dart` variant leaves an
# analyzable, testable tree.
#
# All variants run, not just the default one. Once only the bare
# `--apply` was exercised, so `--remove-tasks` and `--remove-feature-flags`
# shipped goldens that imported a routing layout refactored away months
# earlier and no job ever noticed.
#
# This matrix is also why `analysis_options.yaml` can keep excluding
# `tool/golden/**`: a golden is only meaningful once it has been copied over
# the tree it patches, and analyzing it in place would check it against the
# unstripped sources it is meant to replace. Applying each variant and running
# `flutter analyze` afterwards checks the goldens in the only state where the
# answer means anything.
#
# NO `paths-ignore`, deliberately (the same shape as `ci.yml`). These jobs
# are safe to mark required, and `paths-ignore` suppresses the whole workflow
# run, so a required
# check would never report and every pull request would sit on "Expected -
# waiting for status to be reported" forever. The filter lives INSIDE each job
# instead, in "Decide the strip scope": the job always runs and always reports,
# and a docs-only pull request never installs the Flutter toolchain.
name: Strip smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: strip-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Template repository only. This job tests the starter's own tooling, so a
# repository created from the template ("Use this template") skips it unless
# someone runs it by hand: `github.event.repository.is_template` is true only
# in the template itself. Delete this workflow if your project does not keep
# the tooling it tests.
jobs:
  stripped-tree:
    name: Strip ${{ matrix.variant }} + analyze + test
    if: github.event.repository.is_template || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # One broken variant must not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - variant: both-samples-removed
            flags: ''
          - variant: tasks-removed
            flags: '--remove-tasks'
          - variant: feature-flags-removed
            flags: '--remove-feature-flags'
          # Renamed first, then stripped: the golden files are renamed with the
          # tree but keep the import order sorted for flutter_starter.
          - variant: renamed-both
            flags: ''
          # Both samples kept; the bricks
          # step below then drops the Mason bricks.
          - variant: keep-samples
            flags: '--keep-samples'
    steps:
      # fetch-depth: 0 because the scope step diffs base..head. A shallow clone
      # has neither end of that range.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # WHICH PATHS TRIGGER A FULL STRIP RUN
      #
      # The rule is a deny-list, not an allow-list: **everything triggers a full
      # run except** `**/*.md` and `docs/**`, and a `.dart` file under `docs/`
      # triggers one anyway. That direction is deliberate. `tool/golden/**`
      # mirrors `lib/`, so the set of paths that can break a strip variant is
      # too wide to enumerate safely, and a path nobody thought of must run the
      # matrix rather than skip it.
      #
      # Stated as the trigger set, with why each entry is in it:
      #
      #   lib/**                  - the tree being stripped; `strip_sample_features.dart`
      #                             deletes and rewrites files here.
      #   tool/**                 - the strip script itself, and `tool/golden/**`,
      #                             the replacement sources it copies over `lib/`.
      #                             A stale golden is the exact failure this
      #                             matrix exists to catch.
      #   test/**                 - the stripped tree still has to pass `flutter test`,
      #                             and strip deletes the sample features' tests.
      #   integration_test/**     - stripped alongside `test/`; a leftover import
      #                             of a removed feature fails analyze.
      #   examples/**             - analyzed with the package.
      #   pubspec.yaml,
      #   pubspec.lock,
      #   analysis_options.yaml   - change what `flutter pub get`/`analyze` do to
      #                             the stripped tree.
      #   .github/workflows/**    - including this file; a change to the gate must
      #                             prove itself through the gate.
      #   bricks/**, android/**,
      #   ios/**, and everything
      #   else not listed above   - not obviously inert, so it runs. Fail safe.
      #   docs/**/*.dart          - `analysis_options.yaml` does not exclude
      #                             `docs/`, so a Dart file committed there is
      #                             analyzed like any other file.
      #
      # Inert, and only these: `**/*.md` (no step reads markdown) and `docs/**`
      # that is not `.dart` (images and other assets). A docs-only pull request
      # is exactly that, and would otherwise cost several billed minutes across
      # the variants.
      #
      # Anything the step cannot resolve a diff for - workflow_dispatch, a brand
      # new branch, a force push that dropped `before` - fails SAFE and runs the
      # full matrix.
      - name: Decide the strip scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          have() { git rev-parse -q --verify "$1^{commit}" >/dev/null 2>&1; }

          range=''
          case "$EVENT_NAME" in
            pull_request)
              # Three dots: compare head against the merge base, so commits that
              # landed on main after this branch started are not counted as this
              # pull request's changes.
              if have "$PR_BASE_SHA" && have "$PR_HEAD_SHA"; then
                range="$PR_BASE_SHA...$PR_HEAD_SHA"
              fi
              ;;
            push)
              if have "$PUSH_BEFORE" && have "$PUSH_AFTER"; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
          esac

          if [ -z "$range" ]; then
            run=true
            verdict="Could not resolve a diff range for a '$EVENT_NAME' event. Running the full strip matrix."
            changed=''
          else
            changed="$(git diff --name-only "$range")"
            relevant="$(
              {
                printf '%s\n' "$changed" | grep -Ev '^(docs/.*|.*\.md)$' || true
                printf '%s\n' "$changed" | grep -E '^docs/.*\.dart$' || true
              } | grep -v '^$' | sort -u || true
            )"
            if [ -n "$relevant" ]; then
              run=true
              verdict="$(printf '%s\n' "$relevant" | wc -l | tr -d ' ') changed path(s) can affect a stripped tree. Running strip, analyze and test."
            else
              run=false
              verdict="Every changed path matches \`**/*.md\` or \`docs/**\` (and none is a \`.dart\` file), so no strip variant could have been affected. strip, analyze and test were NOT run, and Flutter was NOT installed."
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"

          # A reviewer seeing a green check needs to know which of the two
          # greens it is, so say it in the job summary and in the log.
          if [ "$run" = true ]; then
            headline="RAN IN FULL"
          else
            headline="SKIPPED (docs-only)"
          fi
          echo "Strip smoke [$VARIANT]: $headline - $verdict"

          {
            echo "### Strip smoke scope - \`$VARIANT\`"
            echo
            echo "**$headline**"
            echo
            echo "- event: \`$EVENT_NAME\`"
            echo "- range: \`${range:-unresolved}\`"
            echo "- strip, analyze and test run: \`$run\`"
            echo
            echo "$verdict"
            echo
            echo "<details><summary>Changed paths</summary>"
            echo
            echo '```'
            if [ -n "$changed" ]; then printf '%s\n' "$changed"; else echo "(none)"; fi
            echo '```'
            echo
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Flutter
        if: steps.scope.outputs.run == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies (full starter)
        if: steps.scope.outputs.run == 'true'
        run: flutter pub get

      - name: Rename to my_app first, as fork-and-customize Option B documents
        if: steps.scope.outputs.run == 'true' && matrix.variant == 'renamed-both'
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/guides/onboarding/fork-and-customize.md
          sed -i 's/^name: flutter_starter$/name: my_app/' pubspec.yaml
          awk '/^   NEW=your_package$/{f=1} f{print} f&&/perl -pi/{exit}' "$doc" \
            | sed 's/^   //; s/^NEW=your_package$/NEW=my_app/' > "$RUNNER_TEMP/rename.sh"
          grep -q 'perl -pi' "$RUNNER_TEMP/rename.sh"
          bash -euo pipefail "$RUNNER_TEMP/rename.sh"
          flutter pub get
          dart fix --apply --code=directives_ordering

      - name: Apply strip
        if: steps.scope.outputs.run == 'true'
        run: dart run tool/strip_sample_features.dart --apply ${{ matrix.flags }}

      # The keep-samples variant is the one an adopter keeping both samples
      # uses. Exercise the two documented actions that turned `flutter test`
      # red while an upstream-only guard was still on main: generating
      # and committing a feature slice, and removing bricks/ and mason.yaml
      # the way the README says to: --remove-bricks, which also drops the
      # docs that link into them, so the links must still resolve.
      - name: Generate a feature slice and drop the bricks (keep-samples)
        if: steps.scope.outputs.run == 'true' && matrix.variant == 'keep-samples'
        shell: bash
        run: |
          set -euo pipefail
          test -d lib/features/tasks && test -d lib/features/feature_flags
          ./scripts/dev/create_feature.sh profile
          git add lib/features/profile test/features/profile
          dart run tool/strip_sample_features.dart --apply --keep-samples --remove-bricks
          # No `| head` here: under pipefail its early exit SIGPIPEs the
          # writer and fails the step with exit 141.
          printf 'features: %s\n' "$(cd lib/features && echo *)"
          test ! -e bricks && test ! -e mason.yaml
          dart run tool/check_docs.dart --links

      # After removing a sample the strip deletes its own machinery and every
      # strip marker, so the tree an adopter keeps holds nothing whose only job
      # was producing it. Assert that directly:
      # analyze and test would stay green if it silently stopped.
      - name: The strip removed itself (sample variants)
        if: steps.scope.outputs.run == 'true' && matrix.variant != 'keep-samples'
        shell: bash
        run: |
          set -euo pipefail
          leftovers=0
          for path in tool/strip_sample_features.dart tool/golden \
            .github/workflows/strip-smoke.yml \
            test/tooling/strip_markers_test.dart \
            test/tooling/strip_sample_prose_test.dart; do
            if [ -e "$path" ]; then
              echo "still present after the strip: $path"
              leftovers=$((leftovers + 1))
            fi
          done
          if grep -rnE '<!-- strip:[a-z-]+ (start|end|line) -->' --include='*.md' . ; then
            echo "a strip marker survived"
            leftovers=$((leftovers + 1))
          fi
          if grep -n 'tool/golden' analysis_options.yaml; then
            echo "analysis_options.yaml still excludes the deleted golden tree"
            leftovers=$((leftovers + 1))
          fi
          [ "$leftovers" -eq 0 ] || exit 1
          dart run tool/check_docs.dart
          echo "The strip removed itself and the docs still check."

      - name: Install dependencies (after strip)
        if: steps.scope.outputs.run == 'true'
        run: flutter pub get

      - name: Analyze stripped tree
        if: steps.scope.outputs.run == 'true'
        run: flutter analyze

      - name: Run tests (stripped tree)
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 15
        run: flutter test --timeout=5m
