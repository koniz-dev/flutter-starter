# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - bricks/**/hooks/build/**
    # Mason brick templates contain mustache placeholders (not valid Dart).
    - bricks/**/__brick__/**
    # Golden tree mirrors lib/ for strip_sample_features; not part of the app.
    # Analyzing these in place would measure them against the unstripped
    # sources they exist to replace, so the exclusion stays. Coverage comes
    # from .github/workflows/strip-smoke.yml instead: it applies each strip
    # variant and analyzes the resulting tree, which is the only state in
    # which a golden's correctness is a meaningful question.
    - tool/golden/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# very_good_analysis 11 switched the formatter to `trailing_commas: automate`,
# which joins every short argument list that ends in a comma and reflowed 65
# files here. Keeping `preserve` keeps a written trailing comma meaning "one
# argument per line", and spares a project built on this starter that
# reformat when it takes the upgrade.
formatter:
  trailing_commas: preserve

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:very_good_analysis/analysis_options.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

    # Three lints that ask for syntax new in Dart 3.13. They apply only
    # because the SDK floor is 3.13, and each stays off by decision, not by
    # oversight. Turn one on when you want its style; `dart fix --apply`
    # rewrites the code for the first two.
    #
    # Off: wants `const new(...)` in place of `const ClassName(...)` (278
    # declarations here). The named form is what every Dart reader, generator
    # and doc today writes, and the brick templates and the strip tool's golden copies
    # would have to change in step.
    unnecessary_type_name_in_constructor: false
    # Off: wants `class A;` in place of `class A {}` (142 here). Same reason;
    # the two spellings mean the same thing.
    empty_container_bodies: false
    # Off: before 3.13 this lint only asked for `this.x` where a parameter was
    # assigned to a field of the same name, and nothing here violated that.
    # From 3.13 it also asks for private named initializing formals
    # (`{required this._store}`), which is every hit it reports here (18), and
    # that form is kept out of the code for the same readability reason. The
    # cost is losing the older check too.
    prefer_initializing_formals: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
