org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both flags match what `flutter create` writes for AGP 9 (Flutter 3.47). They
# keep the classic DSL and the separately applied Kotlin plugin; without them
# Flutter's migrator appends them on the first build and dirties this file.
#
# They stay while a resolved plugin applies the Kotlin Gradle plugin itself:
# freerasp, patrol and shared_preferences_android do at the versions in
# pubspec.lock, which is the "plugins that apply KGP" warning every Android
# build prints. test/tooling/android_kotlin_optout_test.dart fails on the PR
# whose lock bump leaves no such plugin: then migrate per
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
# (drop `kotlin-android` from app/build.gradle.kts and both flags here)
# (koniz-dev/flutter-starter#392).
android.newDsl=false
android.builtInKotlin=false
